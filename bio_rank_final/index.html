<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio Rank — NEET Biology Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- App Shell -->
    <div id="app-shell" class="app-shell">

      <!-- Main Content Area -->
      <div class="main-wrapper" id="main-wrapper">

        <!-- Top Bar (mobile) -->
        <header class="topbar hidden" id="topbar">
          <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
            <span></span><span></span><span></span>
          </button>
          <div class="topbar-brand">
            <div class="brand-icon small">B</div>
            <span class="brand-name">Bio Rank</span>
            <span class="vibe-tag fire" style="pointer-events:auto;">Beta</span>
          </div>
          <div class="topbar-actions" id="topbar-actions">
            <div class="streak-badge" id="topbar-streak">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M13.5 0.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5 0.67z"/></svg>
              <span id="topbar-streak-count">0</span>
            </div>
            <div class="topbar-more" id="topbar-more">
              <button class="more-btn" id="more-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu">
                <span></span><span></span><span></span>
              </button>
              <div class="more-menu" id="more-menu" role="menu" aria-hidden="true">
                <a href="#" class="more-menu-item" data-screen="profile" role="menuitem">
                  <span class="more-menu-icon">👤</span><span>Profile</span>
                </a>
                <a href="#" class="more-menu-item" data-screen="settings" role="menuitem">
                  <span class="more-menu-icon">⚙️</span><span>Settings</span>
                </a>
                <a href="#" class="more-menu-item" data-screen="help" role="menuitem">
                  <span class="more-menu-icon">🆘</span><span>Help &amp; Support</span>
                </a>
                <div class="more-menu-divider"></div>
                <a href="#" class="more-menu-item more-menu-logout" onclick="App.logout(true); return false;" role="menuitem">
                  <span class="more-menu-icon">🚪</span><span>Log Out</span>
                </a>
              </div>
            </div>
          </div>
        </header>

        <!-- Screen Container -->
        <main id="screen-container" class="screen-container">
          <!-- Screens are rendered here by JavaScript -->
        </main>

        <!-- Bottom Navigation (mobile) -->
        <nav class="bottom-nav hidden" id="bottom-nav">
          <a href="#" class="bottom-nav-item" data-screen="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </a>
          <a href="#" class="bottom-nav-item" data-screen="pyq-test">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>PYQ</span>
          </a>
          <a href="#" class="bottom-nav-item" data-screen="chapter-test">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Chapters</span>
          </a>
          <a href="#" class="bottom-nav-item" data-screen="improvement-book">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
            <span>Improve</span>
          </a>
          <a href="#" class="bottom-nav-item" data-screen="performance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Rank</span>
          </a>
        </nav>

      </div>
    </div>

    <!-- Nav Drawer Overlay -->
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <!-- Side Navigation Drawer -->
    <aside class="nav-drawer" id="nav-drawer" aria-hidden="true" aria-label="Main navigation">
      <div class="drawer-header">
        <div class="drawer-user">
          <div class="drawer-avatar" id="drawer-avatar">A</div>
          <div class="drawer-user-info">
            <span class="drawer-user-name" id="drawer-user-name">Student</span>
            <span class="drawer-user-rank" id="drawer-user-rank">Bio Rank #—</span>
            <span class="drawer-user-streak" id="drawer-user-streak">🔥 0 Day Streak</span>
          </div>
        </div>
        <button class="drawer-close-btn" id="drawer-close-btn" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <nav class="drawer-nav" id="drawer-nav">
        <a href="#" class="drawer-nav-item" data-screen="home" aria-label="Home">
          <svg class="drawer-nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="drawer-nav-item" data-screen="pyq-test" aria-label="PYQ Test">
          <svg class="drawer-nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>PYQ Test</span>
        </a>
        <a href="#" class="drawer-nav-item" data-screen="chapter-test" aria-label="Chapter-wise Test">
          <svg class="drawer-nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Chapter Test</span>
        </a>
        <a href="#" class="drawer-nav-item" data-screen="improvement-book" aria-label="Improvement Book">
          <svg class="drawer-nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
          <span>Improvement Book</span>
        </a>
        <a href="#" class="drawer-nav-item" data-screen="performance" aria-label="Performance and Ranking">
          <svg class="drawer-nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Performance</span>
        </a>

        <div style="height:1px;background:var(--neutral-100);margin:var(--sp-2) var(--sp-4);"></div>

        <a href="#" class="drawer-nav-item" data-screen="profile" aria-label="Profile">
          <span style="font-size:18px;margin-right:var(--sp-2);display:inline-block;width:24px;text-align:center;">👤</span>
          <span>Profile</span>
        </a>
        <a href="#" class="drawer-nav-item" data-screen="settings" aria-label="Settings">
          <span style="font-size:18px;margin-right:var(--sp-2);display:inline-block;width:24px;text-align:center;">⚙️</span>
          <span>Settings</span>
        </a>
        <a href="#" class="drawer-nav-item" data-screen="help" aria-label="Help & Support">
          <span style="font-size:18px;margin-right:var(--sp-2);display:inline-block;width:24px;text-align:center;">🆘</span>
          <span>Help &amp; Support</span>
        </a>
        <a href="#" class="drawer-nav-item" onclick="App.logout(true); return false;" aria-label="Log Out" style="color:var(--error-600);">
          <span style="font-size:18px;margin-right:var(--sp-2);display:inline-block;width:24px;text-align:center;">🚪</span>
          <span style="font-weight:700;">Log Out</span>
        </a>
      </nav>
    </aside>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Floating emoji decorations -->
    <div class="float-emoji" style="top:12%;left:8%;animation-delay:0s;">🧬</div>
    <div class="float-emoji" style="top:25%;right:6%;animation-delay:1.5s;">✨</div>
    <div class="float-emoji" style="bottom:15%;left:12%;animation-delay:3s;">📚</div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/apiClient.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/test.js"></script>
    <script src="js/weakness.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/feedback.js"></script>
    <script src="js/account.js"></script>
    <script src="js/fulltest.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
    <script src="js/drawer.js"></script>
  </body>
</html>
